<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Mr. Nattakorn</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #1a0b2e; /* สีพื้นหลังมืดแบบในภาพ */
            color: #ffffff;
            overflow: hidden;
            margin: 0;
            height: 100vh;
        }

        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: auto; /* ให้หมุนเล่นได้ */
        }

        /* ปุ่มอธิษฐานวันเกิด */
        .btn-glow {
            background: linear-gradient(90deg, #d946ef, #ec4899);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
            transition: all 0.3s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.8);
            transform: scale(1.05);
        }

        .text-glow {
            text-shadow: 0 0 20px rgba(255, 117, 140, 0.6);
        }
    </style>
</head>
<body class="relative flex flex-col items-center justify-center h-screen">

    <!-- พื้นหลัง 3D Galaxy & Cake -->
    <div id="webgl-container"></div>

    <!-- UI ด้านบนขวา: ปุ่มพักเสียงเพลง -->
    <div class="absolute top-6 right-6 z-10">
        <button class="bg-white/10 backdrop-blur-md border border-white/20 px-4 py-2 rounded-full text-xs flex items-center gap-2 hover:bg-white/20 transition-all">
            <span>⏸ พักเสียงเพลง 🎵</span>
        </button>
    </div>

    <!-- UI ตรงกลาง (อิงจากดีไซน์ในภาพเก่า) -->
    <div class="relative z-10 flex flex-col items-center text-center px-4 pointer-events-none mt-10">
        
        <!-- ป้ายกรอบใสเล็กๆ ด้านบน -->
        <div class="bg-white/5 backdrop-blur-sm border border-white/10 px-6 py-2 rounded-full text-xs font-light text-pink-200 mb-6 flex items-center gap-2">
            <span>✨</span> A Very Special Day For Mr. Nattakorn Dokmaiwai <span>✨</span>
        </div>

        <!-- หัวข้อหลัก -->
        <h1 class="text-5xl md:text-6xl lg:text-7xl font-bold mb-8 leading-tight text-glow pointer-events-auto">
            <span class="bg-clip-text text-transparent bg-gradient-to-r from-pink-300 via-pink-400 to-purple-300">Happy Birthday</span><br>
            <span class="bg-clip-text text-transparent bg-gradient-to-r from-pink-300 via-pink-400 to-purple-300">"Mr. Nattakorn</span><br>
            <span class="bg-clip-text text-transparent bg-gradient-to-r from-pink-300 via-pink-400 to-purple-300">Dokmaiwai"</span>
        </h1>

        <!-- ข้อความรอง -->
        <p class="text-sm md:text-base text-gray-300 font-light max-w-lg mb-10 leading-relaxed pointer-events-auto">
            Mr. Nattakorn Dokmaiwai<br>
            เนื่องในโอกาสวันเกิดครบรอบ 18 ปี หวังว่าจะชอบของขวัญเล็กๆ น้อยๆ ชิ้นนี้นะ
        </p>

        <!-- ปุ่มหลัก -->
        <button class="btn-glow px-8 py-3 rounded-full text-sm md:text-base font-medium flex items-center gap-2 pointer-events-auto">
            ไปอธิษฐานวันเกิดกัน 🤍
        </button>
    </div>

    <!-- ลายน้ำมุมขวาล่าง -->
    <div class="absolute bottom-6 right-6 z-10 text-right opacity-50 pointer-events-none">
        <div class="text-xs font-semibold">Activate Windows</div>
        <div class="text-[10px]">Go to Settings to activate Windows.</div>
    </div>


    <!-- Script สำหรับสร้าง 3D -->
    <script>
        let scene, camera, renderer, particleSystem, cakeSystem;

        function init3D() {
            const container = document.getElementById('webgl-container');

            // 1. Scene & Fog
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x1a0b2e, 0.002);

            // 2. Camera (ปรับมุมมองให้เห็นเค้กจากมุมบนนิดๆ)
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 25, 90);
            camera.lookAt(0, 0, 0);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 4. สร้างพื้นหลัง Galaxy
            createSpiralGalaxy();

            // 5. สร้างเค้ก 3D ตรงกลาง
            createParticleCake();

            // จัดการเมื่อย่อ/ขยายหน้าจอ
            window.addEventListener('resize', onWindowResize);

            // ระบบหมุนด้วยเมาส์ (Interaction)
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            document.addEventListener('mousedown', () => isDragging = true);
            document.addEventListener('mouseup', () => isDragging = false);
            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;
                    scene.rotation.y += deltaX * 0.005;
                    scene.rotation.x += deltaY * 0.005;
                }
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            animate();
        }

        // --- ฟังก์ชันสร้างพื้นหลัง Galaxy หมุนวน ---
        function createSpiralGalaxy() {
            const particleCount = 6000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const colorPink = new THREE.Color('#ff758c');
            const colorPurple = new THREE.Color('#7e22ce');

            for (let i = 0; i < particleCount; i++) {
                const r = Math.random() * 150 + 20; // เว้นที่ตรงกลางให้เค้ก
                const spinAngle = r * 0.15;
                const branchAngle = ((i % 3) * 2 * Math.PI) / 3;

                const x = Math.cos(branchAngle + spinAngle) * r + (Math.random() - 0.5) * 15;
                const y = (Math.random() - 0.5) * 15 - 5;
                const z = Math.sin(branchAngle + spinAngle) * r + (Math.random() - 0.5) * 15;

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                const mixedColor = colorPink.clone().lerp(colorPurple, Math.random());
                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.7,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
        }

        // --- ฟังก์ชันสร้างเค้กวันเกิด 3D (2 ชั้น + เทียน) ---
        function createParticleCake() {
            const particleCount = 4000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            const cakeColor = new THREE.Color('#ff9a9e');
            const icingColor = new THREE.Color('#fecfef');
            const flameColor = new THREE.Color('#fbbf24');

            for (let i = 0; i < particleCount; i++) {
                let x, y, z;
                const rand = Math.random();

                if (rand < 0.4) {
                    // ชั้นล่าง (ฐานเค้ก)
                    const theta = Math.random() * Math.PI * 2;
                    const r = 12; // รัศมีชั้นล่าง
                    x = r * Math.cos(theta);
                    z = r * Math.sin(theta);
                    y = Math.random() * 8; // ความสูงชั้นล่าง
                } else if (rand < 0.6) {
                    // ด้านบนของชั้นล่าง (หน้าเค้กชั้น 1)
                    const theta = Math.random() * Math.PI * 2;
                    const r = Math.random() * 12;
                    x = r * Math.cos(theta);
                    z = r * Math.sin(theta);
                    y = 8;
                } else if (rand < 0.8) {
                    // ชั้นบน (ชั้นที่ 2)
                    const theta = Math.random() * Math.PI * 2;
                    const r = 7; // รัศมีชั้นบน
                    x = r * Math.cos(theta);
                    z = r * Math.sin(theta);
                    y = 8 + Math.random() * 7; // ความสูงชั้นบน
                } else if (rand < 0.95) {
                    // ด้านบนของชั้นบน (หน้าเค้กชั้น 2)
                    const theta = Math.random() * Math.PI * 2;
                    const r = Math.random() * 7;
                    x = r * Math.cos(theta);
                    z = r * Math.sin(theta);
                    y = 15;
                } else {
                    // เทียนตรงกลาง
                    const theta = Math.random() * Math.PI * 2;
                    const r = Math.random() * 0.8;
                    x = r * Math.cos(theta);
                    z = r * Math.sin(theta);
                    y = 15 + Math.random() * 6; // ความสูงเทียนและเปลวไฟ
                }

                // ขยับเค้กให้ลงมาอยู่จุดกึ่งกลางจอ
                positions[i * 3] = x;
                positions[i * 3 + 1] = y - 8; 
                positions[i * 3 + 2] = z;

                // ลงสีให้อนุภาค
                if (y > 19) {
                    // สีเปลวไฟเทียน
                    colors[i * 3] = flameColor.r;
                    colors[i * 3 + 1] = flameColor.g;
                    colors[i * 3 + 2] = flameColor.b;
                } else if (y === 8 || y === 15) {
                    // สีครีมแต่งหน้าเค้ก
                    colors[i * 3] = icingColor.r;
                    colors[i * 3 + 1] = icingColor.g;
                    colors[i * 3 + 2] = icingColor.b;
                } else {
                    // สีตัวเค้ก
                    colors[i * 3] = cakeColor.r;
                    colors[i * 3 + 1] = cakeColor.g;
                    colors[i * 3 + 2] = cakeColor.b;
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 1.2,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });

            cakeSystem = new THREE.Points(geometry, material);
            scene.add(cakeSystem);
        }

        function animate() {
            requestAnimationFrame(animate);

            // หมุนกาแล็กซีช้าๆ
            if (particleSystem) {
                particleSystem.rotation.y += 0.001;
            }

            // หมุนเค้ก
            if (cakeSystem) {
                cakeSystem.rotation.y += 0.005;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // เริ่มต้นการทำงานเมื่อโหลดหน้าเว็บเสร็จ
        window.onload = init3D;
    </script>
</body>
</html>
